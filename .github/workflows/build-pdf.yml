name: Typst PDF Derle ve Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions sekmesinden elle de çalıştırabilmek için

permissions:
  contents: write      # Repoya commit atabilmek için write gerekli
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Fontları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra

      - name: Typst Kur
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "0.15.1"   # kendi sürümünüzle değiştirin

      - name: PDF Derle
        run: |
          mkdir -p dist
          typst compile main.typ dist/2026_2027_9_programlamanin_temelleri.pdf

      - name: PDF'i Repoya Kaydet
        run: |
          cp dist/2026_2027_9_programlamanin_temelleri.pdf 2026_2027_9_programlamanin_temelleri.pdf
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2026_2027_9_programlamanin_temelleri.pdf
          # Değişiklik yoksa commit atma (ilk çalıştırmada veya içerik değişmediğinde)
          git diff --cached --quiet || git commit -m "chore: PDF güncellendi [skip ci]"
          git push

      - name: Dağıtım Paketi Hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e Yayınla
        id: deployment
        uses: actions/deploy-pages@v4