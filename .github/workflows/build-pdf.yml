name: Typst PDF Derle ve Yayınla

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Typst Kur
        uses: typst-community/setup-typst@v3

      - name: PDF Derle
        run: |
          mkdir -p dist
          typst compile main.typ dist/2026-2027_9_Sinif_Programlamanin_Temelleri.pdf

      - name: Dağıtım Paketi Hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
