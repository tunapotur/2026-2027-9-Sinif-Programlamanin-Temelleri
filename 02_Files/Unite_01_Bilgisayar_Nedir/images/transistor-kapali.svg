<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <title>Transistör kapalı durum</title>
  <defs>
    <style>
      .t { font-family: 'Arial Black','Impact','Arial',sans-serif; font-weight: 900; stroke-linejoin: round; paint-order: stroke; }
      .lbl { font-family: 'Arial Black','Impact','Arial',sans-serif; font-weight: 900; fill: #8a949c; stroke: #1f2937; stroke-width: 5; stroke-linejoin: round; paint-order: stroke; }
      .note { font-family: 'Arial','Helvetica',sans-serif; font-weight: 700; fill: #111827; }
    </style>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="28" height="28" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#e53935"/>
      <rect x="14" width="14" height="28" fill="#ffffff"/>
    </pattern>
    <radialGradient id="domeOff" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#9aa0a6"/>
      <stop offset="1" stop-color="#5d6268"/>
    </radialGradient>
    <g id="xm">
      <path d="M-14 -14 L14 14 M14 -14 L-14 14" stroke="#1f2937" stroke-width="12" stroke-linecap="round"/>
      <path d="M-14 -14 L14 14 M14 -14 L-14 14" stroke="#e53935" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="wires" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M880 240 V270 H660 V335"/>
      <path d="M920 240 V270 H1060 V510"/>
      <polyline points="1060,510 1075,520 1045,535 1075,550 1045,565 1075,580 1060,590"/>
      <path d="M1060 590 V720 H920"/>
      <polyline points="920,720 905,720 895,705 880,735 865,705 850,735 835,705 825,720 820,720"/>
      <path d="M820 720 H660"/>
      <path d="M660 620 V760"/>
      <path d="M130 470 H495"/>
    </g>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>

  <!-- Başlık -->
  <text class="t" x="50" y="135" font-size="84" stroke="#1f2937" stroke-width="6">
    <tspan fill="#2d4a63">KAPALI</tspan><tspan fill="#7b868e" dx="22">DURUM</tspan>
  </text>

  <!-- Kablolar -->
  <use href="#wires" stroke="#1f2937" stroke-width="11"/>
  <use href="#wires" stroke="#dfe6ec" stroke-width="5"/>

  <!-- Dalgalı topraklama -->
  <g stroke="#1f2937" stroke-width="7" stroke-linecap="round">
    <path d="M610 762 H710"/><path d="M630 782 H690"/><path d="M646 802 H674"/>
  </g>
  <circle cx="660" cy="720" r="10" fill="#dfe6ec" stroke="#1f2937" stroke-width="4"/>

  <!-- LED (sönük) -->
  <g stroke="#1f2937" stroke-width="5" stroke-linejoin="round">
    <rect x="873" y="200" width="14" height="42" fill="#4b5057"/>
    <rect x="913" y="200" width="14" height="42" fill="#4b5057"/>
    <ellipse cx="900" cy="195" rx="58" ry="15" fill="#4b5057"/>
    <path d="M860 192 V140 A40 40 0 0 1 940 140 V192 Z" fill="url(#domeOff)"/>
  </g>
  <path d="M885 150 L895 140 V165 H910 V185" stroke="#3b4046" stroke-width="5" fill="none" stroke-linejoin="round"/>
  <path d="M872 125 Q876 108 892 104" stroke="#c3c8cd" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
  <text class="lbl" x="755" y="185" font-size="40" text-anchor="middle">LED</text>
  <text class="lbl" x="755" y="228" font-size="32" text-anchor="middle">(SÖNÜK)</text>

  <!-- Çıkış -->
  <g class="t" text-anchor="middle" fill="#e53935" stroke="#7f1d1d" stroke-width="5">
    <text x="1085" y="115" font-size="44">ÇIKIŞ:</text>
    <text x="1085" y="205" font-size="100">0</text>
    <text x="1085" y="250" font-size="34">(DÜŞÜK)</text>
  </g>

  <!-- Transistör gövdesi -->
  <circle cx="608" cy="460" r="100" fill="#66798a" stroke="#1f2937" stroke-width="5"/>
  <circle cx="620" cy="470" r="100" fill="#b8c8d6" stroke="#1f2937" stroke-width="5"/>

  <!-- Taban ucu -->
  <rect x="488" y="457" width="52" height="26" rx="5" fill="#8f979e" stroke="#1f2937" stroke-width="4"/>
  <line x1="540" y1="470" x2="590" y2="470" stroke="#111827" stroke-width="5"/>
  <line x1="590" y1="415" x2="590" y2="525" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
  <!-- Kolektör -->
  <path d="M592 450 L660 408 V380" stroke="#111827" stroke-width="5" fill="none" stroke-linejoin="round"/>
  <rect x="648" y="330" width="24" height="75" rx="5" fill="#8f979e" stroke="#1f2937" stroke-width="4"/>
  <!-- Emiter -->
  <path d="M592 490 L660 530 V560" stroke="#111827" stroke-width="5" fill="none" stroke-linejoin="round"/>
  <polygon points="660,530 637,526 645,512" fill="#111827" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
  <rect x="648" y="552" width="24" height="75" rx="5" fill="#8f979e" stroke="#1f2937" stroke-width="4"/>

  <!-- Giriş ucu -->
  <circle cx="130" cy="470" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="5"/>
  <circle cx="130" cy="470" r="8" fill="#111827"/>

  <!-- Etiketler -->
  <text class="lbl" x="630" y="327" font-size="38" text-anchor="end">KOLEKTÖR</text>
  <text class="lbl" x="395" y="428" font-size="40" text-anchor="middle">TABAN</text>
  <text class="lbl" x="630" y="645" font-size="38" text-anchor="end">EMİTER</text>
  <g class="lbl" text-anchor="middle">
    <text x="130" y="350" font-size="46">DÜŞÜK</text>
    <text x="130" y="412" font-size="58">0 V</text>
  </g>
  <text class="lbl" x="130" y="535" font-size="30" text-anchor="middle">İkili 0</text>


  <!-- Engellenen taban akımı -->
  <polygon points="250,548 330,548 330,530 400,562 330,594 330,576 250,576" fill="#b0b8bf" opacity=".85" stroke="#8a949c" stroke-width="3" stroke-linejoin="round"/>
  <use href="#xm" x="305" y="562"/>

  <!-- Engellenen kolektör akımı -->
  <path d="M830 285 V640 Q830 690 780 690 H715" fill="none" stroke="#e53935" stroke-width="8" stroke-dasharray="16 14" opacity=".75"/>
  <use href="#xm" x="830" y="345"/>
  <use href="#xm" x="830" y="600"/>
  <use href="#xm" x="750" y="690"/>

  <!-- Bariyer -->
  <g transform="translate(830,470)" stroke="#1f2937" stroke-width="4" stroke-linejoin="round">
    <rect x="-42" y="14" width="10" height="34" fill="#555"/>
    <rect x="32" y="14" width="10" height="34" fill="#555"/>
    <rect x="-55" y="-20" width="110" height="38" rx="5" fill="url(#stripes)"/>
  </g>
  <g class="t" fill="#e53935" stroke="#7f1d1d" stroke-width="4" font-size="32">
    <text x="895" y="462">AKIM</text>
    <text x="895" y="500">YOK</text>
  </g>

  <!-- Dirençler -->
  <text class="lbl" x="1110" y="560" font-size="40">R</text>
  <text class="lbl" x="875" y="680" font-size="40" text-anchor="middle">R</text>
</svg>
