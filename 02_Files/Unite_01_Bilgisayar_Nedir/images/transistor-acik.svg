<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <title>Transistör açık durum</title>
  <defs>
    <style>
      .t { font-family: 'Arial Black','Impact','Arial',sans-serif; font-weight: 900; stroke-linejoin: round; paint-order: stroke; }
      .lbl { font-family: 'Arial Black','Impact','Arial',sans-serif; font-weight: 900; fill: #6cc24a; stroke: #1f2937; stroke-width: 5; stroke-linejoin: round; paint-order: stroke; }
      .ylbl { font-family: 'Arial Black','Impact','Arial',sans-serif; font-weight: 900; fill: #ffe14d; stroke: #1f2937; stroke-width: 5; stroke-linejoin: round; paint-order: stroke; }
      .note { font-family: 'Arial','Helvetica',sans-serif; font-weight: 700; fill: #111827; }
      .plus { font-family: 'Arial',sans-serif; font-weight: 700; font-size: 20px; fill: #7c4a03; text-anchor: middle; }
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb300" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="domeOn" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="0.5" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#f57c00"/>
    </radialGradient>
    <linearGradient id="colArrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcc33"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <g id="plus">
      <circle r="12" fill="#ffd54f" stroke="#f59e0b" stroke-width="3"/>
      <text class="plus" y="7">+</text>
    </g>
    <g id="wires" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M920 240 V270 H1060 V510"/>
      <polyline points="1060,510 1075,520 1045,535 1075,550 1045,565 1075,580 1060,590"/>
      <path d="M1060 590 V720 H920"/>
      <polyline points="920,720 905,720 895,705 880,735 865,705 850,735 835,705 825,720 820,720"/>
      <path d="M820 720 H660"/>
      <path d="M660 620 V760"/>
    </g>
    <g id="hot" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M880 240 V270 H660 V335"/>
      <path d="M130 470 H495"/>
    </g>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>

  <!-- Başlık -->
  <text class="t" x="50" y="135" font-size="84" stroke="#1f2937" stroke-width="6">
    <tspan fill="#ffe14d">AÇIK</tspan><tspan fill="#2d4a63" dx="22">DURUM</tspan>
  </text>

  <!-- Kablolar -->
  <use href="#wires" stroke="#1f2937" stroke-width="11"/>
  <use href="#wires" stroke="#dfe6ec" stroke-width="5"/>
  <use href="#hot" stroke="#1f2937" stroke-width="11"/>
  <use href="#hot" stroke="#ffe14d" stroke-width="5"/>

  <!-- Topraklama -->
  <g stroke="#1f2937" stroke-width="7" stroke-linecap="round">
    <path d="M610 762 H710"/><path d="M630 782 H690"/><path d="M646 802 H674"/>
  </g>
  <circle cx="660" cy="720" r="10" fill="#dfe6ec" stroke="#1f2937" stroke-width="4"/>

  <!-- LED parlaması -->
  <circle cx="900" cy="150" r="130" fill="url(#glow)"/>
  <g stroke="#f59e0b" stroke-width="9" stroke-linecap="round">
    <line x1="900" y1="55" x2="900" y2="20"/>
    <line x1="951" y1="74" x2="974" y2="47"/>
    <line x1="849" y1="74" x2="826" y2="47"/>
    <line x1="975" y1="108" x2="1008" y2="96"/>
    <line x1="825" y1="108" x2="792" y2="96"/>
  </g>

  <!-- LED (yanık) -->
  <g stroke="#1f2937" stroke-width="5" stroke-linejoin="round">
    <rect x="873" y="200" width="14" height="42" fill="#8f979e"/>
    <rect x="913" y="200" width="14" height="42" fill="#8f979e"/>
    <ellipse cx="900" cy="195" rx="58" ry="15" fill="#ef6c35"/>
    <path d="M860 192 V140 A40 40 0 0 1 940 140 V192 Z" fill="url(#domeOn)"/>
  </g>
  <path d="M885 150 L895 140 V165 H910 V185" stroke="#c2570c" stroke-width="5" fill="none" stroke-linejoin="round" opacity=".6"/>
  <path d="M872 125 Q876 108 892 104" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
  <text class="ylbl" x="790" y="205" font-size="42" text-anchor="middle">LED</text>

  <!-- Çıkış -->
  <g class="t" text-anchor="middle" fill="#ffe14d" stroke="#1f2937" stroke-width="5">
    <text x="1095" y="130" font-size="44">ÇIKIŞ:</text>
    <text x="1095" y="225" font-size="100">1</text>
    <text x="1095" y="270" font-size="34">(YÜKSEK)</text>
  </g>

  <!-- Transistör gövdesi -->
  <circle cx="608" cy="460" r="100" fill="#66798a" stroke="#1f2937" stroke-width="5"/>
  <circle cx="620" cy="470" r="100" fill="#b8c8d6" stroke="#1f2937" stroke-width="5"/>

  <!-- Taban -->
  <rect x="488" y="457" width="52" height="26" rx="5" fill="#8fd16f" stroke="#1f2937" stroke-width="4"/>
  <line x1="540" y1="470" x2="590" y2="470" stroke="#111827" stroke-width="5"/>
  <line x1="590" y1="415" x2="590" y2="525" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
  <!-- Kolektör -->
  <path d="M592 450 L660 408 V380" stroke="#111827" stroke-width="5" fill="none" stroke-linejoin="round"/>
  <rect x="648" y="330" width="24" height="75" rx="5" fill="#8fd16f" stroke="#1f2937" stroke-width="4"/>
  <!-- Emiter -->
  <path d="M592 490 L660 530 V560" stroke="#111827" stroke-width="5" fill="none" stroke-linejoin="round"/>
  <polygon points="660,530 637,526 645,512" fill="#111827" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
  <rect x="648" y="552" width="24" height="75" rx="5" fill="#8f979e" stroke="#1f2937" stroke-width="4"/>

  <!-- Giriş ucu -->
  <circle cx="130" cy="470" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="5"/>
  <circle cx="130" cy="470" r="8" fill="#111827"/>

  <!-- Etiketler -->
  <text class="lbl" x="630" y="327" font-size="38" text-anchor="end">KOLEKTÖR</text>
  <text class="lbl" x="395" y="428" font-size="40" text-anchor="middle">TABAN</text>
  <text class="lbl" x="630" y="645" font-size="38" text-anchor="end">EMİTER</text>
  <g class="ylbl" text-anchor="middle">
    <text x="130" y="350" font-size="46">YÜKSEK</text>
    <text x="130" y="412" font-size="58">5 V</text>
    <text x="130" y="535" font-size="30">İkili 1</text>
  </g>


  <!-- Taban akımı -->
  <g stroke="#facc15" stroke-width="4" stroke-linejoin="round" fill="#fff3a8" fill-opacity=".85">
    <polygon points="240,548 320,548 320,530 380,562 320,594 320,576 240,576"/>
    <polygon points="400,548 440,548 440,530 500,562 440,594 440,576 400,576"/>
  </g>
  <use href="#plus" x="268" y="562"/><use href="#plus" x="300" y="562"/>
  <use href="#plus" x="418" y="562"/><use href="#plus" x="452" y="562"/>
  <text class="ylbl" x="335" y="645" font-size="34" text-anchor="middle">Taban</text>
  <text class="ylbl" x="335" y="685" font-size="34" text-anchor="middle">Akımı</text>

  <!-- Kolektör akımı -->
  <polygon points="814,290 846,290 846,610 872,610 830,670 788,610 814,610" fill="url(#colArrow)" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round"/>
  <use href="#plus" x="830" y="330"/><use href="#plus" x="830" y="400"/>
  <use href="#plus" x="830" y="470"/><use href="#plus" x="830" y="540"/>
  <use href="#plus" x="830" y="600"/>
  <g class="ylbl">
    <text x="885" y="455" font-size="34">Kolektör</text>
    <text x="885" y="495" font-size="34">Akımı</text>
  </g>

  <!-- Dirençler -->
  <text class="lbl" x="1110" y="560" font-size="40" style="fill:#8a949c">R</text>
  <text class="lbl" x="875" y="690" font-size="40" text-anchor="middle" style="fill:#8a949c">R</text>
</svg>
